name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generator tests
        working-directory: generator
        run: go test ./...

      - name: Regenerate library sources
        working-directory: generator
        run: go run . generate --from-json testdata/golden/v4.0.20/metamodel.json --out ../library/src/main/kotlin

      - name: Committed sources must match the generator
        run: git diff --exit-code -- library/src/main/kotlin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build, test, and publish to GitHub Packages
        working-directory: library
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle build publish -PreleaseVersion="${GITHUB_REF_NAME#v}"
