name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: generator/go.sum

      - name: Generator tests
        working-directory: generator
        run: go test ./...

      - name: Regenerate library sources
        working-directory: generator
        run: go run . generate --from-json testdata/golden/v4.0.20/metamodel.json --out ../library/src/main/kotlin

      - name: Committed sources must match the generator
        run: git diff --exit-code -- library/src/main/kotlin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Build, test, and publish to Reposilite
        working-directory: library
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: gradle build publish -PreleaseVersion="${GITHUB_REF_NAME#v}"
