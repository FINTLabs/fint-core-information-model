name: build
on:
  push:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        working-directory: generator
        run: go test ./...

      - name: Build
        working-directory: generator
        run: go build ./...

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Regenerate library sources
        working-directory: generator
        run: go run . generate --from-json testdata/golden/v4.0.20/metamodel.json --out ../library/src/main/kotlin

      - name: Committed sources must match the generator
        run: git diff --exit-code -- library/src/main/kotlin

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build and test library
        working-directory: library
        run: gradle build
